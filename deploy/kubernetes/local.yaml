# Local MVP only. No management API, credentials, or production ingress.
apiVersion: v1
kind: Namespace
metadata:
  name: homelab-paas
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: homelab-paas
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane
          image: homelab-paas/control-plane:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: "1"
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: homelab-paas
spec:
  type: NodePort
  selector:
    app: control-plane
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
