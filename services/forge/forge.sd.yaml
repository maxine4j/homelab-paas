version: 1
metadata:
    serviceId: forge
resources:
    app:
        type: web
        image: ghcr.io/maxine4j/homelab-paas/forge:latest
        replicas: 1
        rolloutStrategy: recreate
        ingress:
            public: false
            port: 8080
        healthcheckUrl: /health
        env:
            - name: FORGE_OWNER
              secret: true
            - name: FORGE_ORIGIN
              value: https://${SERVICE_DOMAIN}
        volumes:
            - mountPath: /data
        termination:
            timeoutSeconds: 30
