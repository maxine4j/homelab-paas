# PaaS provides authentication before requests reach this private resource.
[auth.anonymous]
enabled = true
org_role = Admin

[auth]
disable_login_form = true

[auth.basic]
enabled = false

[metrics]
enabled = true

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[plugins]
preinstall_disabled = true
public_key_retrieval_disabled = true

# Additional plugin source, independent of the persistent operator plugin path.
[plugin.victoriametrics-logs-datasource]
path = /opt/grafana/plugins/victoriametrics-logs-datasource
