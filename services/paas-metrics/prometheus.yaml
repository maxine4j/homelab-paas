global:
    scrape_interval: 30s
scrape_configs:
    - job_name: grafana
      static_configs:
          - targets: [grafana:3000]
            labels:
                serviceId: paas-metrics
                revision: __BUILD_REVISION__
    - job_name: victoriametrics
      static_configs:
          - targets: [victoriametrics:8428]
            labels:
                serviceId: paas-metrics
                revision: __BUILD_REVISION__
    - job_name: victorialogs
      static_configs:
          - targets: [victorialogs:9428]
            labels:
                serviceId: paas-metrics
                revision: __BUILD_REVISION__
    - job_name: paas
      honor_labels: true
      static_configs:
          - targets: [control-plane.paas.internal:9090]
            labels:
                serviceId: paas
                revision: unknown
