version: 1
metadata:
    serviceId: paas-metrics
resources:
    grafana:
        type: web
        primary: true
        image: ghcr.io/maxine4j/homelab-paas/metrics-grafana:${COMMIT_ID:40}
        rolloutStrategy: recreate
        healthcheckUrl: /api/health
        ingress:
            public: false
            port: 3000
        volumes:
            - hostPath: /var/homelab-paas/paas-metrics/grafana
              mountPath: /var/lib/grafana
              ownership:
                  uid: 472
                  gid: 0
    victoriametrics:
        type: worker
        image: ghcr.io/maxine4j/homelab-paas/metrics-victoriametrics:${COMMIT_ID:40}
        rolloutStrategy: recreate
        healthcheckPort: 8428
        healthcheckUrl: /health
        volumes:
            - hostPath: /var/homelab-paas/paas-metrics/victoriametrics
              mountPath: /storage
    victorialogs:
        type: worker
        image: victoriametrics/victoria-logs:v1.53.0
        rolloutStrategy: recreate
        healthcheckPort: 9428
        healthcheckUrl: /health
        command:
            - -storageDataPath=/storage
            - -retentionPeriod=14d
        volumes:
            - hostPath: /var/homelab-paas/paas-metrics/victorialogs
              mountPath: /storage
    telegraf:
        type: worker
        selinuxLabeling: false
        image: ghcr.io/maxine4j/homelab-paas/metrics-telegraf:${COMMIT_ID:40}
        rolloutStrategy: recreate
        healthcheckPort: 8080
        limits:
            cpus: 0.1
            memoryMiB: 128
        volumes:
            - hostPath: /var/run/docker.sock
              mountPath: /var/run/docker.sock
              readOnly: true
            - hostPath: /var/homelab-paas/paas-metrics/telegraf
              mountPath: /var/lib/telegraf
              ownership: false
