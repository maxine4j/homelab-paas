[agent]
  interval = "30s"
  flush_interval = "5s"
  metric_batch_size = 100
  metric_buffer_limit = 1000
  omit_hostname = true
  statefile = "/var/lib/telegraf/telegraf.state"

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  timeout = "5s"
  container_state_include = ["running"]
  docker_label_include = ["homelab-paas.cluster", "homelab-paas.service", "homelab-paas.resource", "homelab-paas.revision", "homelab-paas.role"]
  perdevice_include = []
  total_include = ["cpu", "blkio", "network"]

[[inputs.docker_log]]
  endpoint = "unix:///var/run/docker.sock"
  timeout = "5s"
  from_beginning = false
  docker_label_include = ["homelab-paas.cluster", "homelab-paas.service", "homelab-paas.resource", "homelab-paas.revision", "homelab-paas.role"]

[[processors.rename]]
  order = 1
  [[processors.rename.replace]]
    tag = "homelab-paas.service"
    dest = "serviceId"
  [[processors.rename.replace]]
    tag = "homelab-paas.revision"
    dest = "revision"
  [[processors.rename.replace]]
    tag = "homelab-paas.cluster"
    dest = "cluster"

[[processors.regex]]
  order = 2
  [[processors.regex.tags]]
    key = "homelab-paas.role"
    pattern = "^control-plane$"
    replacement = "paas"
    result_key = "serviceId"
  [[processors.regex.tags]]
    key = "revision"
    pattern = "^([a-fA-F0-9]{7})[a-fA-F0-9]*$"
    replacement = "${1}"

[[processors.defaults]]
  order = 3
  [processors.defaults.tags]
    serviceId = "unmanaged"
    revision = "unknown"
    cluster = "unmanaged"

[[outputs.influxdb]]
  urls = ["http://victoriametrics:8428"]
  database = "victoriametrics"
  skip_database_creation = true
  exclude_retention_policy_tag = true
  timeout = "5s"
  namedrop = ["docker_log"]

[[outputs.loki]]
  domain = "http://victorialogs:9428"
  endpoint = "/insert/loki/api/v1/push"
  timeout = "5s"
  sanitize_label_names = true
  namepass = ["docker_log"]

[[outputs.health]]
  service_address = "http://:8080"
  max_time_between_metrics = "90s"
  namepass = ["docker"]
