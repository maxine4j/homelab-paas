[agent]
  interval = "30s"
  flush_interval = "5s"
  metric_batch_size = 100
  metric_buffer_limit = 1000
  omit_hostname = true
  statefile = "/var/lib/telegraf/telegraf.state"

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  timeout = "5s"
  container_state_include = ["running"]
  docker_label_include = ["homelab-paas.*"]
  perdevice_include = []
  total_include = ["cpu", "blkio", "network"]

[[inputs.docker_log]]
  endpoint = "unix:///var/run/docker.sock"
  timeout = "5s"
  from_beginning = false
  docker_label_include = ["homelab-paas.*"]

[[outputs.influxdb]]
  urls = ["http://victoriametrics:8428"]
  database = "victoriametrics"
  skip_database_creation = true
  exclude_retention_policy_tag = true
  timeout = "5s"
  namedrop = ["docker_log"]

[[outputs.loki]]
  domain = "http://victorialogs:9428"
  endpoint = "/insert/loki/api/v1/push"
  timeout = "5s"
  sanitize_label_names = true
  namepass = ["docker_log"]

[[outputs.health]]
  service_address = "http://:8080"
  max_time_between_metrics = "90s"
  namepass = ["docker"]
