name: homelab-paas-local
services:
    paas:
        build:
            context: ..
            dockerfile: services/paas/Dockerfile
        init: true
        environment:
            GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
            GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
            SESSION_SIGNING_KEY: ${SESSION_SIGNING_KEY}
            DIGITALOCEAN_API_TOKEN: ${DIGITALOCEAN_API_TOKEN}
            ACME_EMAIL: ${ACME_EMAIL}
        labels:
            homelab-paas.cluster: local
            homelab-paas.role: control-plane
        volumes:
            - ./etc:/etc/homelab-paas
            - ./var:/var/homelab-paas
            - /var/run/docker.sock:/var/run/docker.sock
            - ..:/mnt/repo:ro
        healthcheck:
            test:
                [
                    CMD,
                    node,
                    -e,
                    "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
                ]
            interval: 5s
            timeout: 3s
            retries: 10
        networks: [platform]
    envoy:
        image: envoyproxy/envoy:v1.37.0
        command: [-c, /etc/homelab-paas/envoy.yaml]
        environment:
            ENVOY_UID: "0"
        labels:
            homelab-paas.cluster: local
            homelab-paas.role: envoy
        ports:
            - "127.0.0.1:80:80"
            - "127.0.0.1:443:443"
        volumes:
            - ./etc:/etc/homelab-paas:ro
            - ./var:/var/homelab-paas:ro
        depends_on:
            paas:
                condition: service_healthy
        networks: [platform]
networks:
    platform: {}
