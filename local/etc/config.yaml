# Local source reads committed files through Git.
version: 1
metadata:
    clusterId: local
ingress:
    baseDomain: local.maxine4j.com
    httpPort: 80
    httpsPort: 443
auth:
    github:
        clientId: ""
        clientSecret: ""
        allowedUsers:
            - maxine4j
    session:
        issuer: homelab-paas-local
        audience: homelab-paas-local
        signingKey: ""
        ttlSeconds: 3600
tls:
    acme:
        email: ""
    dns:
        provider: digitalocean
        credentials:
            apiToken: ""
git:
    pollIntervalSeconds: 300
    operationTimeoutSeconds: 60
reconciliation:
    retryBackoffSeconds: 5
    maxRetryBackoffSeconds: 60
services:
    test-service:
        remote: local
        descriptorPath: /mnt/repo/services/test-service/test-service.sd.yaml
