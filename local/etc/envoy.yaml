static_resources:
    listeners:
        - name: http
          address:
              socket_address: { address: 0.0.0.0, port_value: 8080 }
          filter_chains:
              - filters:
                    - name: envoy.filters.network.http_connection_manager
                      typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                          stat_prefix: local_http
                          route_config:
                              name: local
                              virtual_hosts:
                                  - name: paas
                                    domains: [localhost, "localhost:*"]
                                    routes:
                                        - match: { prefix: / }
                                          route: { cluster: paas }
                          http_filters:
                              - name: envoy.filters.http.router
                                typed_config:
                                    "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    clusters:
        - name: paas
          type: STRICT_DNS
          connect_timeout: 2s
          load_assignment:
              cluster_name: paas
              endpoints:
                  - lb_endpoints:
                        - endpoint:
                              address:
                                  socket_address: { address: paas, port_value: 8080 }
