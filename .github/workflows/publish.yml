name: Publish
on:
    push:
        branches: [main]
        tags: ["v*.*.*"]
permissions:
    contents: read
jobs:
    ci:
        uses: ./.github/workflows/ci.yml
    publish:
        runs-on: ubuntu-24.04
        needs: ci
        permissions:
            contents: read
            packages: write
        steps:
            - name: Download tested images
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: tested-images
                  path: /tmp/tested-images
            - name: Load tested images
              run: docker load --input /tmp/tested-images/tested-images.tar
            - name: Select image tag
              id: image
              shell: bash
              run: |
                  image="ghcr.io/${GITHUB_REPOSITORY,,}"
                  tag="$GITHUB_SHA"
                  if [[ "$GITHUB_REF_TYPE" == tag ]]; then
                      tag="$GITHUB_REF_NAME"
                  fi
                  echo "ref=$image:$tag" >> "$GITHUB_OUTPUT"
                  echo "test-service-image=$image/test-service" >> "$GITHUB_OUTPUT"
                  echo "short-sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
            - name: Log in to GHCR
              env:
                  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
            - name: Publish control-plane image
              env:
                  IMAGE_REF: ${{ steps.image.outputs.ref }}
              run: docker push "$IMAGE_REF"
            - name: Publish test-service image
              env:
                  IMAGE: ${{ steps.image.outputs.test-service-image }}
                  SHORT_SHA: ${{ steps.image.outputs.short-sha }}
              run: |
                  docker push "$IMAGE:$SHORT_SHA"
                  docker push "$IMAGE:latest"
