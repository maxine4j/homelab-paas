name: CI
on:
    push:
    pull_request:
permissions:
    contents: read
jobs:
    build:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
            - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm check
            - run: pnpm test
            - run: pnpm build
    package:
        runs-on: ubuntu-24.04
        needs: build
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
            - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
              with:
                  name: homelab-paas-build
            - run: docker buildx build --builder homelab-paas-build --platform linux/amd64 --file services/paas/Dockerfile --tag homelab-paas/paas:ci --load .
            - run: docker buildx build --builder homelab-paas-build --platform linux/amd64 --file services/test-service/Dockerfile --tag test-service:local --load .
            - run: docker compose -f local/docker-compose.yaml config --quiet
