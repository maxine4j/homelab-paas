name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: bazel-contrib/setup-bazel@4fd964a13a440a8aeb0be47350db2fc640f19ca8 # 0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - run: bazel build --lockfile_mode=error //:check //services/control-plane:control-plane //services/paas-ui:bundle
      - run: bazel test --lockfile_mode=error //...
      - run: bazel build --lockfile_mode=error --config=linux-amd64 //deploy/appliance:image
