name: CI
on:
    push:
        branches: [main]
        tags: ["v*.*.*"]
    pull_request:
permissions:
    contents: read
jobs:
    build:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
            - name: Validate release tag
              if: github.ref_type == 'tag'
              shell: bash
              run: |
                  if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                      echo "Release tags must use vX.X.X with no leading zeroes."
                      exit 1
                  fi
            - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm check
            - run: pnpm test
            - run: bash -n prod/install.sh && python3 -m unittest discover -s prod -p 'test_*.py'
            - run: pnpm build
    package:
        runs-on: ubuntu-24.04
        needs: build
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
            - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
              with:
                  name: homelab-paas-build
            - name: Select image tag
              id: image
              shell: bash
              run: |
                  image="ghcr.io/${GITHUB_REPOSITORY,,}"
                  tag="$GITHUB_SHA"
                  if [[ "$GITHUB_REF_TYPE" == tag ]]; then
                      tag="$GITHUB_REF_NAME"
                  fi
                  echo "ref=$image:$tag" >> "$GITHUB_OUTPUT"
                  echo "test-service-image=$image/test-service" >> "$GITHUB_OUTPUT"
                  echo "short-sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
            - name: Build control-plane image
              env:
                  IMAGE_REF: ${{ steps.image.outputs.ref }}
              run: >-
                  docker buildx build --builder homelab-paas-build --platform linux/amd64
                  --file services/paas/Dockerfile --tag "$IMAGE_REF"
                  --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
                  --label "org.opencontainers.image.revision=$GITHUB_SHA" --load .
            - name: Build test-service image
              env:
                  IMAGE: ${{ steps.image.outputs.test-service-image }}
                  SHORT_SHA: ${{ steps.image.outputs.short-sha }}
              run: >-
                  docker buildx build --builder homelab-paas-build --platform linux/amd64
                  --file services/test-service/Dockerfile --tag "$IMAGE:latest" --tag "$IMAGE:$SHORT_SHA"
                  --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
                  --label "org.opencontainers.image.revision=$GITHUB_SHA" --load .
            - run: docker compose -f local/docker-compose.yaml config --quiet
            - name: Log in to GHCR
              if: github.event_name == 'push'
              env:
                  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
            - name: Publish control-plane image
              if: github.event_name == 'push'
              env:
                  IMAGE_REF: ${{ steps.image.outputs.ref }}
              run: docker push "$IMAGE_REF"
            - name: Publish test-service image
              if: github.event_name == 'push'
              env:
                  IMAGE: ${{ steps.image.outputs.test-service-image }}
                  SHORT_SHA: ${{ steps.image.outputs.short-sha }}
              run: |
                  docker push "$IMAGE:$SHORT_SHA"
                  docker push "$IMAGE:latest"
