name: CI
on:
    pull_request:
    workflow_call:
permissions:
    contents: read
jobs:
    validate:
        name: Validate release tag
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Validate release tag
              if: github.ref_type == 'tag'
              shell: bash
              run: |
                  if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                      echo "Release tags must use vX.X.X with no leading zeroes."
                      exit 1
                  fi
    format:
        name: Formatting
        runs-on: ubuntu-24.04
        needs: validate
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - run: pnpm format:check
    lint:
        name: Lint
        runs-on: ubuntu-24.04
        needs: validate
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - run: pnpm lint
    typecheck:
        name: Typecheck
        runs-on: ubuntu-24.04
        needs: validate
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - run: pnpm typecheck
    unit:
        name: Unit tests
        runs-on: ubuntu-24.04
        needs: validate
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - run: pnpm test
    installer:
        name: Installer checks
        runs-on: ubuntu-24.04
        needs: validate
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - run: bash -n prod/install.sh && bash -n prod/upgrade-paas.sh && python3 -m unittest discover -s prod -p 'test_*.py'
    build:
        name: Workspace build
        runs-on: ubuntu-24.04
        needs: validate
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - run: pnpm build
    integration:
        name: Integration tests
        runs-on: ubuntu-24.04
        needs: validate
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - run: pnpm test:containers integration
            - name: Retain integration diagnostics
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: integration-diagnostics
                  path: artifacts/
                  retention-days: 7
    e2e:
        name: Image build and E2E tests
        runs-on: ubuntu-24.04
        needs: build
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
              with:
                  name: homelab-paas-build
            - uses: ./.github/actions/setup
            - name: Select image tag
              id: image
              shell: bash
              run: |
                  image="ghcr.io/${GITHUB_REPOSITORY,,}"
                  tag="$GITHUB_SHA"
                  if [[ "$GITHUB_REF_TYPE" == tag ]]; then
                      tag="$GITHUB_REF_NAME"
                  fi
                  echo "ref=$image:$tag" >> "$GITHUB_OUTPUT"
                  echo "test-service-image=$image/test-service" >> "$GITHUB_OUTPUT"
                  echo "short-sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
            - name: Build control-plane image
              env:
                  IMAGE_REF: ${{ steps.image.outputs.ref }}
              run: >-
                  docker buildx build --builder homelab-paas-build --platform linux/amd64
                  --file services/paas/Dockerfile --tag "$IMAGE_REF"
                  --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
                  --label "org.opencontainers.image.revision=$GITHUB_SHA" --load .
            - name: Build test-service image
              env:
                  IMAGE: ${{ steps.image.outputs.test-service-image }}
                  SHORT_SHA: ${{ steps.image.outputs.short-sha }}
              run: >-
                  docker buildx build --builder homelab-paas-build --platform linux/amd64
                  --file services/test-service/Dockerfile --tag "$IMAGE:latest" --tag "$IMAGE:$SHORT_SHA"
                  --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
                  --label "org.opencontainers.image.revision=$GITHUB_SHA" --load .
            - run: docker compose -f local/docker-compose.yaml config --quiet
            - run: docker compose -f prod/etc/homelab-paas/docker-compose.yaml config --quiet
            - name: Build isolated Chromium test image
              run: |
                  version=$(pnpm --filter @homelab-paas/paas exec node -p "require('@playwright/test/package.json').version")
                  docker build --file services/paas/tests/fixtures/browser.Dockerfile --build-arg "PLAYWRIGHT_VERSION=$version" --tag homelab-paas/playwright:ci .
            - name: Real Docker/Envoy E2E tests
              env:
                  PAAS_IMAGE: ${{ steps.image.outputs.ref }}
                  TEST_SERVICE_IMAGE: ${{ steps.image.outputs.test-service-image }}:${{ steps.image.outputs.short-sha }}
              run: pnpm test:containers e2e
            - name: Retain E2E diagnostics
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: e2e-diagnostics
                  path: artifacts/
                  retention-days: 7
            - name: Export tested images
              if: github.event_name == 'push'
              env:
                  IMAGE_REF: ${{ steps.image.outputs.ref }}
                  IMAGE: ${{ steps.image.outputs.test-service-image }}
                  SHORT_SHA: ${{ steps.image.outputs.short-sha }}
              run: |
                  docker save --output /tmp/tested-images.tar "$IMAGE_REF" "$IMAGE:$SHORT_SHA" "$IMAGE:latest"
            - name: Retain tested images for publishing
              if: github.event_name == 'push'
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: tested-images
                  path: /tmp/tested-images.tar
                  compression-level: 0
                  retention-days: 1
